<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Simple Player Discord Presence</title>
<style>
:root{color-scheme:dark;--bg:#16181a;--panel:#1d2023;--line:#2b3034;--text:#e4e6e8;--muted:#858b91;--ok:#5bc58a;--warn:#e0a84d;--bad:#e06c6c}
*{box-sizing:border-box}
body{margin:0;width:300px;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif}
header{display:flex;align-items:center;gap:10px;padding:14px 14px 12px;border-bottom:1px solid var(--line)}
header img{width:28px;height:28px;border-radius:6px}
header b{display:block;font-size:13px}header span{font-size:11px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.switch{position:relative;width:40px;height:22px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#3a3f44;border-radius:22px;cursor:pointer;transition:.18s}
.slider:before{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.18s}
input:checked+.slider{background:#5865f2}input:checked+.slider:before{transform:translateX(18px)}
.status{padding:12px 14px;display:grid;gap:7px;border-bottom:1px solid var(--line)}
.line{display:flex;gap:8px;align-items:baseline}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:0 0 8px;transform:translateY(-1px)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.label{color:var(--muted);flex:0 0 74px}
.value{min-width:0;overflow-wrap:anywhere}
.hint{padding:10px 14px;font-size:11px;color:var(--muted)}
.hint code{background:var(--panel);padding:1px 4px;border-radius:3px;color:var(--text)}
details{padding:0 14px 12px}
summary{cursor:pointer;color:var(--muted);font-size:11px;padding:6px 0}
.cid{display:flex;gap:6px}
.cid input{flex:1;min-width:0;height:28px;padding:0 8px;border:1px solid var(--line);border-radius:4px;background:#101213;color:var(--text);font:12px monospace}
button{height:28px;padding:0 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--text);cursor:pointer;font:12px system-ui,sans-serif}
button:hover{border-color:var(--muted)}
</style>
</head>
<body>
<header><img src="icons/icon-48.png" alt=""><div><b>Discord 狀態</b><span>Simple Player 電腦版網頁</span></div></header>
<label class="row"><span>顯示正在聽的歌</span><span class="switch"><input id="enabled" type="checkbox"><span class="slider"></span></span></label>
<div class="status">
  <div class="line"><span id="hostDot" class="dot"></span><span class="label">本機程式</span><span id="host" class="value">—</span></div>
  <div class="line"><span id="discordDot" class="dot"></span><span class="label">Discord</span><span id="discord" class="value">—</span></div>
  <div class="line"><span class="dot" id="songDot"></span><span class="label">正在播放</span><span id="song" class="value">—</span></div>
</div>
<div id="hint" class="hint" hidden></div>
<details>
  <summary>進階設定</summary>
  <div class="cid"><input id="clientId" spellcheck="false" placeholder="Discord Application ID"><button id="saveCid" type="button">儲存</button></div>
  <div style="margin-top:8px"><button id="retry" type="button">重新連線</button></div>
</details>
<script src="popup.js"></script>
</body>
</html>
